[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "latent-art-bench"
version = "0.1.0"
description = "Measurement-qualified development pilot for LatentArtBench"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "Pillow>=10.4,<12",
  "pydantic>=2.9,<3",
  "PyYAML>=6.0,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
learned = [
  "accelerate>=1.10,<2",
  "diffusers>=0.35,<1",
  "opencv-python-headless>=4.11,<5",
  "safetensors>=0.6,<1",
  "torch>=2.7,<3",
  "transformers>=4.44,<5",
]
analysis = [
    "matplotlib>=3.9,<4",
    "pywavelets>=1.6,<2",
    "scikit-image>=0.24,<1",
    "scipy>=1.13,<2",
]

[project.scripts]
latent-art-bench = "latent_art_bench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/latent_art_bench"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "live: makes a real request through the local openai-oauth proxy",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
