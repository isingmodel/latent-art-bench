  candidate_artist_audit: configs/pilot_0/candidate_artist_audit.csv
  candidate_work_audit: configs/pilot_0/candidate_work_audit.jsonl
  candidate_overrides: configs/pilot_0/candidate_overrides.json
  canonical_manifest: configs/pilot_0/manifests/canonical_works.jsonl
  reproduction_manifest: configs/pilot_0/manifests/reproductions.jsonl
  canonical_manifest_sha256: 0e3b15cbf0de28cf15e3d2e5430c88aea9ee68283b392aacbc66e7dec9a52f3a
  reproduction_manifest_sha256: 3908a3eab4db54c8954ad4a82a50d12699517cfca800c983b79069d0afbd1f62
  common_genre: landscape_and_outdoor_place_scene
  target_works_per_artist: [20, 30]
