        wikidata: Q175130
    - artist_id: camille_pissarro
      artist_name: Camille Pissarro
      neighbor_artist_id: paul_cezanne
      movements: [Impressionism]
      authority_ids:
        aic_agent_id: "36211"
        cma_creator_id: "1836"
        nga_constituent_id: "1791"
        ulan: "500011889"
        wikidata: Q134741
    - artist_id: paul_cezanne
      artist_name: Paul Cezanne
      neighbor_artist_id: camille_pissarro
      movements: [Post-Impressionism]
      authority_ids:
        aic_agent_id: "40482"
        cma_creator_id: "1754"
        nga_constituent_id: "1115"
        ulan: "500004793"
        wikidata: Q35548
  museum_sources: [aic, cma, met, nga]
  aic_image_width: 1686
  image_long_side: 1024
  max_works_per_artist: 30
  split_seed: 20260830
  held_out_fraction: 0.3
  nga_open_data_revision: 04aacd5f8baa29259a0873e00099d93bf50e7533
  met_open_data_revision: 6fa206f0df6cf349d4fe558028d4c08e95f44eb6
  met_open_data_sha256: de617b9c947458e426111207f81a65bd1379a151c0077d3ce29cfc22fc0b9183

preprocessing:
  track: harmonized_chromatic_v2
  version: "2.0.0"
  color_space: sRGB
  alpha_background_rgb: [255, 255, 255]
  border_policy: keep
  resample: lanczos
  max_long_side: 500
  no_upsampling: true
  output_format: png

measurements:
  required: [chromatic, learned_formal]
  chromatic:
    enabled: true
    feature_version: lee2018-seamlessness-s-v2
    source_doi: 10.1371/journal.pone.0204430
    adjacency: horizontal_and_vertical
    standard_deviation_ddof: 0
    degenerate_epsilon: 1.0e-12
    normalized_histogram_lower_edges: [0.0, 0.25, 0.5, 0.75, 1.0, 1.5, 2.0, 3.0, 4.0, 6.0, 8.0]
    vector_representation: seamlessness
  learned_formal:
    enabled: true
    feature_version: kim2026-sd20-a-vector-source-file-seeded-sample-v2
    source_repository: https://github.com/aljinny/art-history
    source_revision: 7da12358cf34dad2184f357a048c2cf114b3c4e0
    source_checkout_dir: artifacts/sources/kim-art-history
    checkpoint: 512-base-ema.ckpt
    input_size: [512, 512]
    latent_shape: [4, 64, 64]
    flatten_order: C
    feasibility_report: docs/LEARNED_FORMAL_FEASIBILITY.md
    model_repository: Manojb/stable-diffusion-2-base
    model_revision: 64bf7b4f10eee35494b38d55c06c0c78cf8b44d0
    model_snapshot_dir: artifacts/models/sd2-base-vae
    model_config_sha256: 6b194a1bad5f6ab0431cc254088949b814f75d0c3230483ad8fc6be2cc1495a0
    model_weights_sha256: a1d993488569e928462932c8c38a0760b874d166399b14414135bd9c42df5815
    full_checkpoint_sha256: d635794c1fedfdfa261e065370bea59c651fc9bfa65dc6d67ad29e11869a1824
    full_checkpoint_size_bytes: 5214864007
    model_verification_report: reports/pilot_1/evidence/learned_formal_model_verification.json
    resize_library: opencv
    resize_interpolation: INTER_LANCZOS4
    opencv_version: 4.14.0
    opencv_build_sha256: c201b5ba726b7370afc3cb0d338454e2964afe1aa907849908b27850ecc043cf
    pillow_version: 11.3.0
    jpeg_codec_version: "6.2"
    python_version: 3.13.11
    platform_system: Darwin
    platform_release: 25.6.0
    platform_machine: arm64
    numpy_version: 2.5.2
    torch_version: 2.13.0
    diffusers_version: 0.40.0
    torch_mps_built: true
    torch_mps_available: true
    input_color_order: RGB
    input_tensor_range: [-1.0, 1.0]
    latent_scale: 0.18215
    sampling_policy: seeded_posterior_sample
    base_seed: 20260830
    seed_derivation: sha256_of_resized_rgb_plus_base_seed
    device: mps
    dtype: float32
    pca_variance_target: 0.95
    pca_max_components: 32
    source_input_role: original_reproduction_file
    source_preprocessing_policy: opencv_imread_resize_imwrite_same_extension_then_pillow_rgb
    intermediate_encoding_policy: preserve_source_extension

qualification:
  required_before_scientific_generation: true
  cards:
    - configs/pilot_1/qualification/chromatic.json
    - configs/pilot_1/qualification/learned_formal.json
  source_prediction_max_balanced_accuracy: 0.55
  artist_prediction_min_balanced_accuracy: 0.35
  leave_source_out_artist_min_balanced_accuracy: 0.30
  reproduction_to_within_artist_median_ratio_max: 1.0
  perturbation_to_within_artist_median_ratio_max: 0.5
  perturbation_long_side: 400
  perturbation_jpeg_quality: 85
  random_seed: 20260830
  qualification_protocol_version: real-only-qualification-v3
  matched_input_long_side: 1024
  canonical_chromatic_long_side: 500
  perturbation_jpeg_subsampling: "4:2:0"
  bootstrap_draws: 2000
  confidence_level: 0.95
  require_bootstrap_upper_bound: true
  learned_determinism_probe_count: 4

generation:
  mode: test_only
  scientific_claims_enabled: false
  models: [gpt-image-1, gpt-image-2]
  base_url: http://127.0.0.1:10531/v1
  require_loopback: true
  endpoint: images/generations
  prompt_manifest: configs/pilot_1/prompts.jsonl
  output_dir: outputs/pilot_1/gpt_images
  manifest_attestation: reports/pilot_1/evidence/generation_manifest_attestation.json
  repetitions: 2
  size: 1024x1024
  quality: low
  output_format: png
  timeout_seconds: 300
  max_retries: 2

analysis:
  primary_distance: energy_distance
  calibrated_target_gap_formula: (D_generated_target-D_real_real)/D_target_neighbor
  specificity_formula: (D_generated_neighbor-D_generated_target)/D_target_neighbor
  specificity_sign_convention: positive_means_target_closer
  equal_sample_seed: 20260830
  equal_sample_draws: 200
  confidence_level: 0.95
