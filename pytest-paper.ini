[pytest]
# Routine runner settings; pytest.ini and pyproject.toml are frozen evidence.
# Import by package path so versioned studies can reuse descriptive test filenames.
addopts = -ra --import-mode=importlib -m "not live"
# Routine coverage for the current paper; see tests/README.md.
# An explicit `pytest tests` also collects the retained historical suites.
testpaths =
    # Shared features and evidence integrity
    tests/test_evidence.py
    tests/test_naming_integrity_audit.py
    tests/painter_feature_generation_v2/test_methods.py
    tests/painter_feature_generation_v2/test_audit.py
    tests/painter_feature_generation_v2/test_empirical.py
    # Four-painter observations, assignments and descriptive statistics
    tests/painter_distribution_exploration_v1
    tests/test_painter_prompt_retry_report_v2.py
    tests/painter_prompt_study_v1/test_analysis.py
    tests/painter_prompt_study_v1/test_audit.py
    tests/painter_prompt_study_v1/test_measurement.py
    tests/painter_prompt_study_v1/test_prompts.py
    tests/painter_prompt_study_v1/test_randomization.py
    tests/painter_prompt_study_v1/test_randomization_record.py
    tests/painter_prompt_study_v1/test_statistics.py
    # Controlled comparisons, missingness and report values
    tests/painter_distribution_study_v1/test_analysis_publication.py
    tests/painter_distribution_study_v1/test_continuation_results.py
    tests/painter_distribution_study_v1/test_diagnostics.py
    tests/painter_distribution_study_v1/test_immediate_results.py
    tests/painter_distribution_study_v1/test_inference.py
    tests/painter_distribution_study_v1/test_main_analysis.py
    tests/painter_distribution_study_v1/test_main_report.py
    tests/painter_distribution_study_v1/test_measurement.py
    tests/painter_distribution_study_v1/test_parallel_results.py
    tests/painter_distribution_study_v1/test_pilot_summary.py
    tests/painter_distribution_study_v1/test_recovery_results.py
    tests/painter_distribution_study_v1/test_reference_delivery.py
    tests/painter_distribution_study_v1/test_references.py
    tests/painter_distribution_study_v1/test_statistics.py
    tests/painter_distribution_study_v1/test_study.py
    tests/painter_distribution_revision_v1
    # Palette response, measurement challenges and temporal comparisons
    tests/painter_responsiveness_v1/test_design_inference.py
    tests/painter_responsiveness_v2/test_common.py
    tests/painter_responsiveness_v2/test_diagnostics.py
    tests/painter_responsiveness_v2/test_prv2_analysis.py
    tests/painter_responsiveness_v2/test_report.py
    tests/painter_responsiveness_v2/test_workflow.py
    tests/test_painter_responsiveness_analysis.py
    tests/test_painter_responsiveness_measurement.py
    tests/test_painter_responsiveness_quantiles_v1.py
    tests/test_painter_responsiveness_reference_validation.py
    tests/test_painter_responsiveness_report.py
    tests/test_paper_palette_replay.py
    tests/painter_measurement_validation_v1
    tests/painter_naming_replication_v1
    # Moment maps, clauses, arithmetic oracles and current transport safeguards
    tests/painter_naming_geometry_v1
    tests/painter_naming_centering_v1
    tests/painter_clause_validation_v1/test_analysis.py
    tests/painter_clause_successor_v1/test_analysis.py
    tests/painter_map_validation_v2/test_analysis.py
    tests/painter_map_validation_v2/test_analysis_oracle.py
    tests/painter_map_validation_v2/test_precision.py
    tests/painter_map_validation_v2/test_operations.py
    # Current artist recovery, explicit transport and reference-mixture sensitivity
    tests/painter_specificity_v1
    tests/painter_specificity_v2
    tests/painter_specificity_reference_v1
    tests/painter_specificity_measurement_v1
    tests/painter_specificity_review_v1
    # Main/current public replay contracts and the numerical diagnostic
    tests/test_paper_release.py
    tests/test_paper_map_validation_release.py
    tests/test_paper_map_portability_diagnostic.py
# Two frozen legacy modules import test helpers by these original names.
pythonpath = tests tests/painter_feature_generation_v1
markers =
    live: makes a real request through the local openai-oauth proxy
